openapi: 3.0.3
info:
  title: Disc Golf Scorekeeper API
  version: 0.1.0
  description: Learning example. Calculates totals with completed-round validation and without persistence.
paths:
  /api/v1/users:
    get:
      summary: Get all users, including users without rounds
      responses:
        '200':
          description: Users ordered by username and ID. Empty array if there are no users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Could not retrieve users.
        '503':
          description: Storage is unavailable.
  /api/v1/rounds:
    get:
      summary: Get all rounds and hole scores for a username, newest first
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching rounds with hole scores ordered by hole number. Empty array when none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Round'
                    - type: object
                      properties:
                        id:
                          type: integer
                          format: int64
        '400':
          description: Username is missing or blank.
        '500':
          description: Could not retrieve rounds.
        '503':
          description: Round storage is unavailable.
  /healthz:
    get:
      responses:
        '200':
          description: API is running; this does not check the database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong
  /api/v1/rounds/total:
    post:
      summary: Calculate strokes, par, and score relative to par without saving the round
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Round'
      responses:
        '200':
          description: Scoring totals for a valid completed round.
          content:
            application/json:
              schema:
                type: object
                required: [total_strokes, total_par, score_relative_to_par]
                properties:
                  total_strokes:
                    type: integer
                    example: 7
                  total_par:
                    type: integer
                    example: 6
                  score_relative_to_par:
                    type: integer
                    description: Total strokes minus total par; positive is over par, negative is under par, and zero is even.
                    example: 1
        '400':
          description: JSON cannot be decoded or the round fails validation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/rounds/course_par:
    post:
      summary: Calculate the course par from holes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Round'
      responses:
        '200':
          description: Sum of the holes par. 
          content: 
            application/json:
              schema:
                type: object
                required: [total_par]
                properties:
                  total_par:
                    type: integer
                    example: 60
        '400':
          description: JSON cannot be decoded or the round fails validation.
          content: 
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
    Round:
      type: object
      description: Completed round. Hole numbers must be unique; validation returns the first error.
      required: [username, course_name, date, holes]
      properties:
        username:
          type: string
          minLength: 1
          description: Player name; must contain non-whitespace text. Saving requires an existing user in the users table.
        course_name:
          type: string
          minLength: 1
          description: Must contain non-whitespace text.
        date:
          type: string
          format: date-time
          description: RFC 3339 timestamp with timezone, for example 2026-10-10T15:42:00+02:00. Responses may use UTC for the same instant.
        holes:
          type: array
          minItems: 1
          items:
            type: object
            required: [hole_number, par, strokes]
            properties:
              hole_number:
                type: integer
                minimum: 1
              par:
                type: integer
                minimum: 1
              strokes:
                type: integer
                minimum: 1
